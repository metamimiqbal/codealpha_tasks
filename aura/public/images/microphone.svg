<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="micBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#231933" />
      <stop offset="100%" stop-color="#0e0a17" />
    </radialGradient>
    <linearGradient id="micGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#micBg)" />
  <!-- Base stand -->
  <ellipse cx="200" cy="340" rx="60" ry="14" fill="#1e1b2e" stroke="#473e66" stroke-width="2" />
  <rect x="195" y="270" width="10" height="70" fill="#362f4e" rx="4" />
  <!-- U-shape yoke mount -->
  <path d="M 150 180 C 150 290, 250 290, 250 180" fill="none" stroke="#473e66" stroke-width="6" stroke-linecap="round" />
  <!-- Mic Capsule body -->
  <rect x="170" y="80" width="60" height="150" rx="30" fill="#1a1429" stroke="url(#micGlow)" stroke-width="2.5" />
  <!-- Mesh top -->
  <rect x="173" y="83" width="54" height="70" rx="27" fill="#2d2242" opacity="0.9" />
  <!-- Gain knob -->
  <circle cx="200" cy="185" r="7" fill="#ec4899" />
  <circle cx="200" cy="205" r="4" fill="#8b5cf6" />
</svg>
