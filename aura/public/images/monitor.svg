<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="monBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#192233" />
      <stop offset="100%" stop-color="#0a0e17" />
    </radialGradient>
    <linearGradient id="monScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#monBg)" />
  <!-- Stand base and neck -->
  <rect x="190" y="270" width="20" height="60" fill="#334155" rx="3" />
  <ellipse cx="200" cy="330" rx="65" ry="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Monitor frame -->
  <rect x="50" y="80" width="300" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="3" />
  <!-- Screen display -->
  <rect x="58" y="88" width="284" height="175" rx="6" fill="#020617" />
  <rect x="62" y="92" width="276" height="167" rx="4" fill="url(#monScreen)" opacity="0.85" />
  <!-- Mountain graphic on wallpaper -->
  <polygon points="120,240 180,150 240,240" fill="rgba(255,255,255,0.25)" />
  <polygon points="190,240 250,130 310,240" fill="rgba(255,255,255,0.15)" />
  <!-- Sleek chin logo -->
  <circle cx="200" cy="270" r="2.5" fill="#64748b" />
</svg>
