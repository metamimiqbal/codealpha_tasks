<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="chgBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162529" />
      <stop offset="100%" stop-color="#091113" />
    </radialGradient>
    <linearGradient id="chgAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#chgBg)" />
  <!-- Base dock -->
  <ellipse cx="200" cy="310" rx="90" ry="24" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="200" cy="308" r="14" fill="#0f172a" stroke="url(#chgAccent)" stroke-width="2" />
  <!-- Upright stem -->
  <line x1="200" y1="300" x2="200" y2="170" stroke="#475569" stroke-width="12" stroke-linecap="round" />
  <!-- Phone MagSafe Disc -->
  <circle cx="200" cy="150" r="50" fill="#1e293b" stroke="url(#chgAccent)" stroke-width="3" />
  <circle cx="200" cy="150" r="30" fill="none" stroke="rgba(20, 184, 166, 0.4)" stroke-width="2" stroke-dasharray="6 4" />
  <!-- Charging icon in center -->
  <polygon points="198,135 190,150 198,150 196,165 208,148 200,148" fill="#14b8a6" />
